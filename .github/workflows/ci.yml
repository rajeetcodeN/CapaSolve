name: CapaSolve SaaS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./flow-sync-saas

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: flow-sync-saas/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Vitest Suite
        run: npm run test

      - name: Run Production Bundle Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_SUPABASE_PROJECT_ID: ymvdbaexgtxjjrpodiwf
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy_anon_key
